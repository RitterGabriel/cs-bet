# Aplicação
spring.application.name=cs-bet-backend
server.port=8080

# Oracle Database
spring.datasource.url=jdbc:oracle:thin:@//localhost:1522/freepdb1
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Migrações apenas por execução explícita: perfil migrate ou comando --catalog-import.
spring.flyway.enabled=false

# API pública Market.CSGO + câmbio PTAX/BCB. Ativar somente após aplicar V6 explicitamente.
csbet.market.enabled=${MARKET_QUOTES_ENABLED:false}
csbet.market.source=${MARKET_QUOTES_SOURCE:market-csgo}
