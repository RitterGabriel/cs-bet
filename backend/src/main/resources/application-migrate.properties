# Execução explícita: mvn spring-boot:run -Dspring-boot.run.profiles=migrate
# Aplica migrations pendentes e inicia a API. Não executa o importador de catálogo.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=CSBET
spring.flyway.default-schema=CSBET
spring.flyway.create-schemas=false
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
