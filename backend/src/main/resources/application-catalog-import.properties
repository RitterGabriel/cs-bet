# Perfil reservado ao comando explícito --catalog-import; nunca importa ao iniciar a API.
spring.main.web-application-type=none
spring.main.lazy-initialization=true
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=CSBET
spring.flyway.default-schema=CSBET
spring.flyway.create-schemas=false
# O script 001 anterior foi aplicado manualmente. Não recria nem altera CSBET_USERS.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.clean-disabled=true
