services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: csbet-oracle
    restart: unless-stopped

    ports:
      - "127.0.0.1:1522:1521"

    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD}

    volumes:
      - oracle_data:/opt/oracle/oradata

volumes:
  oracle_data:
